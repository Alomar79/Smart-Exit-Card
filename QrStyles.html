<style>
.qr-tools{display:flex;gap:16px;align-items:end;flex-wrap:wrap;margin-bottom:24px}.qr-tools label{flex:1;min-width:180px}.qr-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.qr-card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-width:0;padding:20px;background:#fff;border:1px solid #ccd8cf;border-radius:14px;text-align:center;direction:rtl;break-inside:avoid}.qr-pink{background:#fff4f8;border-color:#ddb2c5}.qr-green{background:#f0f8f0;border-color:#a8c9b1}.qr-card .school-logo{width:96px;max-width:100%;height:auto;object-fit:contain;background:transparent}.qr-card p,.qr-card h2{margin:0;overflow-wrap:anywhere}.qr-card h2{font-size:21px;line-height:1.4}.qr-card .school-name{font-size:14px}.qr-caption{font-size:17px;font-weight:bold}.qr-instruction{font-size:13px}.qr-code{background:white;line-height:0;flex-shrink:0}.qr-code svg{display:block;width:200px;height:200px;max-width:100%;background:#fff}.qr-note{font-size:13px;color:#5c7165}.qr-logo{width:fit-content;max-width:100%;background:transparent}
@media print{
  @page{size:A4 portrait;margin:12mm}
  body{background:#fff;color:#000}
  body> :not(.container),.container> :not(#app),#app> :not(.qr-grid){display:none!important}
  .container{width:100%;max-width:none;margin:0;padding:0}
  .qr-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8mm;direction:rtl}
  .qr-card{height:122mm;padding:5mm;gap:2mm;border:0.25mm dashed #999;border-radius:0;box-shadow:none;break-inside:avoid;page-break-inside:avoid;print-color-adjust:exact;-webkit-print-color-adjust:exact}
  .qr-card .school-logo{width:22mm;max-width:100%;height:auto;object-fit:contain;background:transparent}
  .qr-card .school-name{font-size:10pt;line-height:1.3}
  .qr-card h2{font-size:14pt;line-height:1.35}
  .qr-caption{font-size:12pt}
  .qr-instruction{font-size:10pt;line-height:1.4}
  .qr-code svg{width:40mm;height:40mm;max-width:none;background:#fff}
  .qr-card[hidden]{display:none!important}
}

@media screen and (max-width:620px){.qr-grid{grid-template-columns:1fr}.qr-tools{display:grid}.qr-tools label{min-width:0}}
</style>
