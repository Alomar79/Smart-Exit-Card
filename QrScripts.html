function qrItems(data) {
  if (!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(data.url)) return null;
  return data.cards.map(card => ({
    groupId:card.GroupID, theme:card.CardTheme, title:card.GroupName,
    caption:'بطاقة الخروج', instruction:'امسح الرمز لتسجيل الخروج أو العودة',
    link:data.url+'?'+new URLSearchParams({view:'card',cardId:card.CardID}).toString()
  })).concat([{groupId:'',theme:'',title:'لوحة متابعة المشرفة',caption:'',instruction:'امسح الرمز لفتح لوحة المتابعة',link:data.url+'?view=supervisor'}]);
}
function filterQrItems(items, mode, groupId) {
  return items.filter(item => (!groupId || item.groupId === groupId) &&
    (mode === 'all' || mode === 'supervisor' && !item.groupId || mode === item.theme));
}
function renderQr() {
  const items=qrItems(state.data);
  if(!items){app.innerHTML='<p class="empty">افتح صفحة البطاقات من رابط تطبيق الويب المنشور.</p>';return;}
  app.innerHTML='<section class="qr-tools"><label>البطاقات<select id="qr-mode">'+[['all','جميع البطاقات'],['Pink','الزهرية فقط'],['Green','الخضراء فقط'],['supervisor','بطاقة المشرفة فقط']].map(([value,label])=>'<option value="'+value+'">'+label+'</option>').join('')+'</select></label><label>المجموعة<select id="qr-group">'+options(state.data.cards,'GroupID','GroupName','جميع المجموعات')+'</select></label><button id="print" type="button">طباعة البطاقات</button><p class="qr-note">ورق A4 · حجم فعلي 100% · أوقف رؤوس الصفحات وتذييلاتها من نافذة الطباعة.</p></section><div class="qr-grid" id="qr-grid"></div><p id="qr-empty" class="empty" hidden>لا توجد بطاقات لهذا الاختيار</p>';
  const mode=document.getElementById('qr-mode'),group=document.getElementById('qr-group');
  mode.value=state.qrMode;group.value=state.qrGroup;
  if(group.value!==state.qrGroup)state.qrGroup='';
  function draw(){
    const visible=filterQrItems(items,state.qrMode,state.qrGroup);
    group.disabled=state.qrMode==='supervisor';
    document.getElementById('qr-grid').innerHTML=visible.map((item,index)=>'<article class="qr-card '+(item.theme==='Pink'?'qr-pink':item.theme==='Green'?'qr-green':'')+'"><div class="qr-logo">'+QR_LOGO_HTML+'</div><h2>'+esc(item.title)+'</h2>'+(item.caption?'<p class="qr-caption">'+item.caption+'</p>':'')+'<div class="qr-code" id="qr-'+index+'"></div><p class="qr-instruction">'+item.instruction+'</p></article>').join('');
    visible.forEach((item,index)=>{const qr=qrcode(0,'M');qr.addData(item.link);qr.make();document.getElementById('qr-'+index).innerHTML=qr.createSvgTag({cellSize:4,margin:16,scalable:true});});
    document.getElementById('qr-empty').hidden=visible.length>0;document.getElementById('print').disabled=!visible.length;
  }
  mode.onchange=()=>{state.qrMode=mode.value;if(mode.value==='supervisor'){state.qrGroup='';group.value='';}draw();};
  group.onchange=()=>{state.qrGroup=group.value;draw();};
  document.getElementById('print').onclick=async()=>{
    const button=document.getElementById('print');button.disabled=true;
    try {
      await Promise.all(Array.from(document.querySelectorAll('.qr-card img')).map(img=>img.decode()));
      window.print();
    } catch(_){notice('تعذر تحميل الترويسة، تحقق من ملف الشعار');}
    finally{button.disabled=false;}
  };
  draw();
}
</script>
